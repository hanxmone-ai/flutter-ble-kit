name: flutter_ble_kit
description: Bluetooth Low Energy toolkit and demo app for Flutter - scan, connect, inspect GATT, live sensor data and receipt printing over BLE.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  escpos_kit:
    git:
      url: https://github.com/hanxmone-ai/escpos-kit.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
