name: ble_kit
description: >-
  Flutter Bluetooth LE toolkit and demo app: scan, connect, browse GATT
  services, read/write/notify, heart-rate parsing and receipt printing.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  escpos_kit:
    git:
      url: https://github.com/hanxmone-ai/escpos-kit
      ref: main
  # 1.36 changed the connect() signature; stay on the API this code targets.
  flutter_blue_plus: ">=1.34.5 <1.36.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
