name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          python3 tool/ci_annotate.py analyze analyze.txt

      - name: Test
        run: |
          set +e
          flutter test --machine > test.json 2> test-stderr.log
          status=$?
          python3 tool/ci_annotate.py tests test.json
          if [ $status -ne 0 ]; then cat test-stderr.log >> test.json; python3 tool/ci_annotate.py log test-stderr.log "flutter test stderr" || true; fi
          exit $status

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: echo "ready=$([ -f android/app/src/main/AndroidManifest.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - if: steps.check.outputs.ready == 'true'
        name: Build APK
        run: |
          set +e
          flutter build apk --debug > build.log 2>&1
          status=$?
          tail -20 build.log
          if [ $status -ne 0 ]; then python3 tool/ci_annotate.py log build.log "flutter build apk"; fi
          exit $status

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ble-kit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  web:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: echo "ready=$([ -f web/index.html ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - if: steps.check.outputs.ready == 'true'
        name: Build web demo
        run: |
          set +e
          flutter build web --release --base-href /flutter-ble-kit/ > build.log 2>&1
          status=$?
          tail -20 build.log
          if [ $status -ne 0 ]; then python3 tool/ci_annotate.py log build.log "flutter build web"; fi
          exit $status

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-demo:
    # Needs Settings → Pages → Source: "GitHub Actions". Until then this job
    # fails without failing the run.
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
