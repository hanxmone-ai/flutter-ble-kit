name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android and iOS folders if missing
        id: platforms
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org io.github.hanxmoneai --project-name ble_kit --platforms android,ios . 2>&1 | tee create.log
            python3 tool/patch_platforms.py
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the generated folders
        if: steps.platforms.outputs.generated == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Add Android and iOS folders generated by flutter create"
          git push

      - name: Get packages
        run: flutter pub get 2>&1 | tee pub.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Test
        run: flutter test 2>&1 | tee test.log

      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ble-kit-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Report analyzer notes
        if: always()
        run: python3 tool/ci_annotate.py notice analyze.log

      - name: Report failures
        if: failure()
        run: python3 tool/ci_annotate.py error create.log pub.log test.log build.log
